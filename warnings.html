            position: fixed;
            display: none;
            background: rgba(20, 20, 20, 0.95);
            color: white;

            border-radius: 8px;

            pointer-events: none;
        }

        }

            margin: 0;

        }

<h1 class="map">Мапа попереджень</h1>   

<object
    id="bizantariaMap"
    data="img/bizantaria_map.svg"
    type="image/svg+xml"
    width="720"
    height="630">
</object>

<div id="warningInfo" class="warning-info" style="display: none;">
    <h3 id="warningTitle"></h3>
    <p id="warningDescription"></p>
</div>

<script>
    const colors = {
        white: "#FFFFFF",
        yellow: "#FFD400",
        red: "#E32636",
        black: "#000000"
    };

    const map = document.getElementById("bizantariaMap");

    map.addEventListener("load", async () => {
        const svg = map.contentDocument;

        const response = await fetch("warnings.json");
        const data = await response.json();

        // Фарбування регіонів
        for (const [regionId, status] of Object.entries(data.warnings)) {
            const region = svg.getElementById(regionId);

            if (region && colors[status]) {
                region.style.fill = colors[status];
            }
        }

        // Елементи інформаційного повідомлення
        const warningInfo = document.getElementById("warningInfo");
        const warningTitle = document.getElementById("warningTitle");
        const warningDescription = document.getElementById("warningDescription");

        // Інформація про попередження
        for (const [regionId, info] of Object.entries(data.info)) {
            const region = svg.getElementById(regionId);

            if (!region) continue;

            region.style.cursor = "pointer";

            // Показ повідомлення
            region.addEventListener("mouseenter", () => {
                warningTitle.textContent = info.title;
                warningDescription.textContent = info.description;
                warningInfo.style.display = "block";
            });

            // Рух повідомлення за курсором
            region.addEventListener("mousemove", (event) => {
                warningInfo.style.position = "fixed";
                warningInfo.style.left = `${event.clientX + 15}px`;
                warningInfo.style.top =
                    `${event.clientY - warningInfo.offsetHeight / 2}px`;
            });

            // Приховування повідомлення
            region.addEventListener("mouseleave", () => {
                warningInfo.style.display = "none";
            });
        }
    });
</script>
